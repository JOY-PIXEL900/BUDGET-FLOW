<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BudgetFlow — Smart Finance</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ===== GLOBAL VARIABLES (preserved original theme) ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root, [data-theme="dark"] {
      --purple: #6C63FF; --mint: #00D4AA; --red: #FF6B6B; --amber: #FFB347;
      --bg: #0F0F1A; --bg2: #13131F; --card: #1A1A2E; --card2: #1E1E35;
      --text: #FFFFFF; --text-sub: rgba(255,255,255,0.5); --text-muted: rgba(255,255,255,0.25);
      --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.12);
      --input-bg: rgba(255,255,255,0.05); --nav-bg: #12121E;
      --scrollbar: rgba(255,255,255,0.08); --chart-grid: rgba(255,255,255,0.05);
    }
    [data-theme="light"] {
      --bg: #F0EFFF; --bg2: #E8E7FA; --card: #FFFFFF; --card2: #F8F7FF;
      --text: #0F0F1A; --text-sub: rgba(15,15,26,0.55); --text-muted: rgba(15,15,26,0.3);
      --border: rgba(15,15,26,0.07); --border2: rgba(15,15,26,0.12);
      --input-bg: rgba(15,15,26,0.04); --nav-bg: #FFFFFF;
      --scrollbar: rgba(15,15,26,0.1); --chart-grid: rgba(15,15,26,0.05);
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      transition: background 0.4s, color 0.4s;
      overflow-x: hidden;
    }

    /* Sidebar (unchanged style) */
    .sidebar {
      width: 240px;
      min-height: 100vh;
      background: var(--nav-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 28px 16px;
      position: fixed;
      top: 0; left: 0;
      z-index: 50;
      transition: background 0.4s, border-color 0.4s, transform 0.3s;
    }
    .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 40px; padding: 0 8px; }
    .logo-icon { width: 36px; height: 36px; background: linear-gradient(135deg, var(--purple), var(--mint)); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
    .logo-text { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 18px; }
    .logo-text span { color: var(--mint); }
    .nav-section-label { font-size: 10px; font-weight: 600; letter-spacing: 1.2px; color: var(--text-muted); text-transform: uppercase; padding: 0 12px; margin: 20px 0 8px; }
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 12px; text-decoration: none; color: var(--text-sub); font-size: 14px; font-weight: 500; transition: all 0.2s; cursor: pointer; margin-bottom: 2px; }
    .nav-item:hover { background: var(--input-bg); color: var(--text); }
    .nav-item.active { background: linear-gradient(135deg, rgba(108,99,255,0.2), rgba(0,212,170,0.1)); color: var(--purple); border: 1px solid rgba(108,99,255,0.2); }
    .nav-icon { font-size: 18px; width: 20px; text-align: center; }
    .nav-badge { margin-left: auto; background: var(--purple); color: white; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 100px; font-family: 'Space Grotesk', sans-serif; }
    .sidebar-bottom { margin-top: auto; border-top: 1px solid var(--border); padding-top: 16px; }
    .user-card { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--input-bg); }
    .avatar { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, var(--purple), var(--mint)); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: white; flex-shrink: 0; }
    .user-name { font-size: 13px; font-weight: 600; }
    .user-email { font-size: 11px; color: var(--text-sub); }

    /* Main content */
    .main { margin-left: 240px; flex: 1; min-height: 100vh; display: flex; flex-direction: column; }
    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 20px 32px; border-bottom: 1px solid var(--border); background: var(--nav-bg); position: sticky; top: 0; z-index: 40; transition: background 0.4s, border-color 0.4s; }
    .topbar-left h1 { font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 800; }
    .theme-btn { background: var(--input-bg); border: 1px solid var(--border2); border-radius: 100px; padding: 7px 14px; display: flex; align-items: center; gap: 7px; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; color: var(--text); transition: all 0.25s; }
    .toggle-track { width: 30px; height: 17px; background: var(--purple); border-radius: 100px; position: relative; transition: background 0.3s; }
    [data-theme="light"] .toggle-track { background: var(--mint); }
    .toggle-thumb { position: absolute; top: 2.5px; left: 2.5px; width: 12px; height: 12px; background: white; border-radius: 50%; transition: transform 0.3s cubic-bezier(.22,1,.36,1); }
    [data-theme="light"] .toggle-thumb { transform: translateX(13px); }
    .content { padding: 28px 32px; flex: 1; }
    .hamburger { display: none; background: none; border: none; cursor: pointer; font-size: 22px; color: var(--text); padding: 4px; }
    .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 49; }

    @media (max-width: 900px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .sidebar-overlay.open { display: block; }
      .main { margin-left: 0; }
      .hamburger { display: flex; }
      .content { padding: 20px 16px; }
    }

    /* dashboard specific cards */
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 28px; }
    .summary-card { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 22px 24px; position: relative; overflow: hidden; transition: transform 0.2s; cursor: default; }
    .summary-card:hover { transform: translateY(-3px); border-color: var(--border2); }
    .summary-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; }
    .card-budget::before { background: linear-gradient(90deg, var(--purple), #8B7FF5); }
    .card-spent::before  { background: linear-gradient(90deg, var(--red), #FF9A9A); }
    .card-remaining::before { background: linear-gradient(90deg, var(--mint), #00E5B8); }
    .card-savings::before { background: linear-gradient(90deg, var(--amber), #FFD080); }
    .card-icon { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 18px; margin-bottom: 16px; background: rgba(108,99,255,0.15); }
    .card-label { font-size: 12px; color: var(--text-sub); margin-bottom: 6px; font-weight: 500; }
    .card-value { font-family: 'Space Grotesk', sans-serif; font-size: 21px; font-weight: 600; letter-spacing: -0.5px; margin-bottom: 8px; }
    .progress-wrap { margin-top: 14px; }
    .progress-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-sub); margin-bottom: 6px; }
    .progress-bar { height: 5px; background: var(--border); border-radius: 100px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 100px; transition: width 1s cubic-bezier(.22,1,.36,1); }
    .bottom-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 28px; }
    .panel { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 24px; transition: background 0.4s; }
    .panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .panel-title { font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700; }
    .chart-wrap { position: relative; height: 200px; }
    .goal-item, .txn-item, .savings-row { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .goal-emoji, .txn-icon { width: 38px; height: 38px; border-radius: 10px; background: var(--input-bg); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
    .goal-info { flex: 1; }
    .goal-name { font-size: 14px; font-weight: 600; margin-bottom: 5px; }
    .goal-bar { height: 4px; background: var(--border); border-radius: 100px; overflow: hidden; }
    .goal-fill { height: 100%; background: linear-gradient(90deg, var(--purple), var(--mint)); }
    .goal-pct { font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 600; color: var(--purple); }
    .txn-amount.out { color: var(--red); }
    .budget-banner { background: linear-gradient(135deg, rgba(108,99,255,0.15), rgba(0,212,170,0.1)); border: 1px solid rgba(108,99,255,0.25); border-radius: 18px; padding: 24px 28px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; gap: 20px; }
    .kes-input-wrap { display: flex; align-items: center; background: var(--card); border: 1px solid var(--border2); border-radius: 12px; }
    .kes-prefix { padding: 0 12px; font-size: 12px; font-weight: 600; color: var(--mint); border-right: 1px solid var(--border); height: 42px; display: flex; align-items: center; }
    .kes-input { background: none; border: none; outline: none; padding: 0 14px; height: 42px; width: 160px; font-size: 15px; font-weight: 600; color: var(--text); }
    .set-btn { padding: 0 20px; height: 42px; background: linear-gradient(135deg, var(--purple), #8B7FF5); color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: 600; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
    .toast { position: fixed; bottom: 28px; right: 28px; background: var(--card); border: 1px solid rgba(0,212,170,0.3); border-radius: 14px; padding: 14px 20px; display: flex; align-items: center; gap: 12px; z-index: 200; transform: translateY(80px); opacity: 0; transition: all 0.35s; }
    .toast.show { transform: translateY(0); opacity: 1; }
    /* Settings & goals & savings form styles */
    .settings-group { margin-bottom: 24px; }
    .settings-group label { display: block; font-size: 13px; margin-bottom: 8px; color: var(--text-sub); }
    .settings-group input { width: 100%; padding: 12px; background: var(--input-bg); border: 1px solid var(--border2); border-radius: 12px; color: var(--text); }
    .save-settings { background: linear-gradient(135deg, var(--purple), #8B7FF5); border: none; padding: 12px 24px; border-radius: 12px; color: white; cursor: pointer; font-weight: 600; }
    .form-card { background: var(--card); border-radius: 20px; padding: 28px; margin-bottom: 28px; }
    .form-title { font-family: 'Syne', sans-serif; font-size: 18px; margin-bottom: 20px; }
    .form-row { margin-bottom: 16px; }
    .form-row input, .form-row select { width: 100%; padding: 12px; background: var(--input-bg); border: 1px solid var(--border2); border-radius: 12px; color: var(--text); }
    .btn-primary { background: linear-gradient(135deg, var(--purple), #8B7FF5); border: none; padding: 12px; border-radius: 12px; color: white; cursor: pointer; font-weight: 600; width: 100%; }
    .goal-list-item, .saving-list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
  </style>
</head>
<body>

<div class="sidebar-overlay" id="overlay" onclick="closeSidebar()"></div>
<div class="toast" id="toast"><span id="toast-msg">Action completed</span></div>

<!-- Dynamic sidebar (will be injected via JS but static for simplicity) -->
<nav class="sidebar" id="sidebar">
  <div class="logo"><div class="logo-icon">💸</div><div class="logo-text">Budget<span>Flow</span></div></div>
  <span class="nav-section-label">Main</span>
  <a class="nav-item" data-page="dashboard" href="#"><span class="nav-icon">🏠</span> Dashboard</a>
  <a class="nav-item" data-page="expenses" href="#"><span class="nav-icon">💳</span> Expenses</a>
  <a class="nav-item" data-page="savings" href="#"><span class="nav-icon">🏦</span> Savings</a>
  <a class="nav-item" data-page="goals" href="#"><span class="nav-icon">🎯</span> Goals</a>
  <a class="nav-item" data-page="settings" href="#"><span class="nav-icon">⚙️</span> Settings</a>
  <div class="sidebar-bottom"><div class="user-card" id="sidebar-user"><div class="avatar" id="sidebar-avatar">JD</div><div><div class="user-name" id="sidebar-name">User</div><div class="user-email" id="sidebar-email">user@email.com</div></div></div></div>
</nav>

<div class="main">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:14px;"><button class="hamburger" onclick="openSidebar()">☰</button><div class="topbar-left"><h1 id="page-title">Dashboard</h1></div></div>
    <div class="topbar-right"><button class="theme-btn" onclick="toggleTheme()"><span id="toggle-emoji">🌙</span><div class="toggle-track"><div class="toggle-thumb"></div></div></button></div>
  </div>
  <div class="content" id="app-content"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
  // ======================== DATA LAYER ========================
  let currentUser = null;
  let appData = {
    users: [],
    budgets: {}, // userId -> budget amount
    expenses: {}, // userId -> array
    savings: {},  // userId -> array
    goals: {}     // userId -> array
  };

  function loadData() {
    const stored = localStorage.getItem('budgetflow_app');
    if (stored) {
      try {
        const parsed = JSON.parse(stored);
        appData = parsed;
      } catch(e) { console.warn(e); }
    }
    const sessionUser = sessionStorage.getItem('bf_current_user');
    if (sessionUser) currentUser = JSON.parse(sessionUser);
    if (!currentUser && appData.users && appData.users.length > 0) currentUser = appData.users[0];
    if (currentUser) updateSidebarUser();
  }
  function saveData() { localStorage.setItem('budgetflow_app', JSON.stringify(appData)); }
  function updateSidebarUser() {
    if(currentUser) {
      document.getElementById('sidebar-name').innerText = currentUser.name || 'User';
      document.getElementById('sidebar-email').innerText = currentUser.email || '';
      document.getElementById('sidebar-avatar').innerText = (currentUser.name?currentUser.name.charAt(0):'U').toUpperCase();
    }
  }
  function ensureUserStructures() {
    if(!currentUser) return;
    const uid = currentUser.id;
    if(!appData.budgets[uid]) appData.budgets[uid] = 0;
    if(!appData.expenses[uid]) appData.expenses[uid] = [];
    if(!appData.savings[uid]) appData.savings[uid] = [];
    if(!appData.goals[uid]) appData.goals[uid] = [];
    saveData();
  }

  // authentication & signup/login (fully functional)
  function registerUser(name, email, password) {
    if(!name || !email || !password) return { success: false, msg: 'All fields required' };
    if(appData.users.find(u => u.email === email)) return { success: false, msg: 'Email already exists' };
    const newUser = { id: Date.now().toString(), name, email, password };
    appData.users.push(newUser);
    const uid = newUser.id;
    appData.budgets[uid] = 0;
    appData.expenses[uid] = [];
    appData.savings[uid] = [];
    appData.goals[uid] = [];
    saveData();
    return { success: true, user: newUser };
  }
  function loginUser(email, password) {
    const user = appData.users.find(u => u.email === email && u.password === password);
    if(user) return { success: true, user };
    return { success: false, msg: 'Invalid credentials' };
  }
  // helpers
  function formatKes(amount) { return 'KES ' + Math.round(amount || 0).toLocaleString('en-KE'); }
  function getTotalSpent() { if(!currentUser) return 0; return (appData.expenses[currentUser.id] || []).reduce((s,e)=>s+e.amount,0); }
  function getTotalSavings() { if(!currentUser) return 0; return (appData.savings[currentUser.id] || []).reduce((s,e)=>s+e.amount,0); }
  function getRemaining(budget, spent) { return Math.max(0, budget - spent); }

  // ---- PAGE RENDERERS (fully working) ----
  let spendChart = null;
  function renderDashboard() {
    const uid = currentUser?.id;
    const budget = appData.budgets[uid] || 0;
    const expenses = appData.expenses[uid] || [];
    const savingsArr = appData.savings[uid] || [];
    const goalsArr = appData.goals[uid] || [];
    const totalSpent = expenses.reduce((s,e)=>s+e.amount,0);
    const totalSavings = savingsArr.reduce((s,e)=>s+e.amount,0);
    const remaining = getRemaining(budget, totalSpent);
    const spentPct = budget>0 ? Math.min(100, (totalSpent/budget)*100) : 0;
    const remainingPct = budget>0 ? Math.min(100, (remaining/budget)*100) : 0;
    const monthName = new Date().toLocaleDateString('en-KE', { month:'long' });
    const html = `
      <div class="budget-banner" id="budget-banner" style="${budget>0 ? 'display:none' : ''}">
        <div><h3>Set Your Monthly Budget</h3><p>Enter total budget for this month</p></div>
        <div class="budget-input-row"><div class="kes-input-wrap"><span class="kes-prefix">KES</span><input class="kes-input" type="number" id="budget-input-val" placeholder="50000" min="0"/></div><button class="set-btn" id="setBudgetBtn">Set Budget</button></div>
      </div>
      <div class="cards-grid">
        <div class="summary-card card-budget"><div class="card-icon">📊</div><div class="card-label">MONTHLY BUDGET</div><div class="card-value" id="val-budget">${formatKes(budget)}</div><div class="card-change">Month of ${monthName}</div></div>
        <div class="summary-card card-spent"><div class="card-icon">💸</div><div class="card-label">AMOUNT SPENT</div><div class="card-value" id="val-spent">${formatKes(totalSpent)}</div><div class="progress-wrap"><div class="progress-label"><span>Spent</span><span id="spent-pct">${Math.round(spentPct)}%</span></div><div class="progress-bar"><div class="progress-fill" style="width:${spentPct}%;background:var(--red)"></div></div></div></div>
        <div class="summary-card card-remaining"><div class="card-icon">✅</div><div class="card-label">REMAINING</div><div class="card-value" id="val-remaining">${formatKes(remaining)}</div><div class="progress-wrap"><div class="progress-label"><span>Remaining</span><span id="remaining-pct">${Math.round(remainingPct)}%</span></div><div class="progress-bar"><div class="progress-fill" style="width:${remainingPct}%;background:var(--mint)"></div></div></div></div>
        <div class="summary-card card-savings"><div class="card-icon">🏦</div><div class="card-label">TOTAL SAVINGS</div><div class="card-value" id="val-savings">${formatKes(totalSavings)}</div><div class="card-change"><span>${totalSavings>0 ? 'Great progress' : 'Start saving today'}</span></div></div>
      </div>
      <div class="bottom-grid">
        <div class="panel"><div class="panel-header"><span class="panel-title">Spending by Category</span></div><div class="chart-wrap"><canvas id="spendChartCanvas"></canvas></div></div>
        <div class="panel"><div class="panel-header"><span class="panel-title">Goals Progress</span><a class="panel-action" href="#" data-nav="goals" style="color:var(--purple)">Manage →</a></div><div id="goals-list">${goalsArr.length===0 ? '<div style="padding:20px;text-align:center">No goals yet. Add one!</div>' : goalsArr.slice(0,3).map(g=>`<div class="goal-item"><div class="goal-emoji">🎯</div><div class="goal-info"><div class="goal-name">${g.name}</div><div class="goal-bar"><div class="goal-fill" style="width:${g.target>0?Math.min(100,(g.saved/g.target)*100):0}%"></div></div></div><div class="goal-pct">${g.target>0?Math.round((g.saved/g.target)*100):0}%</div></div>`).join('')}</div></div>
        <div class="panel"><div class="panel-header"><span class="panel-title">Recent Transactions</span><a class="panel-action" href="#" data-nav="expenses">See All →</a></div><div id="txn-list">${expenses.length===0?'<div style="padding:20px;text-align:center">No transactions</div>':expenses.slice(-5).reverse().map(t=>`<div class="txn-item"><div class="txn-icon">📋</div><div><div class="goal-name">${t.description}</div><div style="font-size:11px;color:var(--text-sub)">${t.category}</div></div><div class="txn-amount out">-${formatKes(t.amount)}</div></div>`).join('')}</div></div>
        <div class="panel"><div class="panel-header"><span class="panel-title">Savings Breakdown</span><a class="panel-action" href="#" data-nav="savings">Add →</a></div><div id="savings-list">${savingsArr.length===0?'<div style="padding:20px;text-align:center">No savings yet</div>':savingsArr.slice(0,3).map(s=>`<div class="savings-row"><div><strong>${s.purpose}</strong><div style="font-size:11px">${new Date(s.date).toLocaleDateString()}</div></div><div style="color:var(--mint)">+${formatKes(s.amount)}</div></div>`).join('')}</div></div>
      </div>`;
    document.getElementById('app-content').innerHTML = html;
    document.getElementById('setBudgetBtn')?.addEventListener('click', () => { const val = parseFloat(document.getElementById('budget-input-val')?.value); if(val>0) { appData.budgets[currentUser.id]=val; saveData(); renderDashboard(); showToast('Budget updated'); } else showToast('Enter valid amount', true); });
    const ctx = document.getElementById('spendChartCanvas')?.getContext('2d');
    if(ctx) {
      const catMap = {};
      expenses.forEach(e=>{ catMap[e.category] = (catMap[e.category]||0)+e.amount; });
      const labels = Object.keys(catMap).length?Object.keys(catMap):['No data'];
      const data = Object.keys(catMap).length?Object.values(catMap):[1];
      if(spendChart) spendChart.destroy();
      spendChart = new Chart(ctx, { type:'doughnut', data:{ labels, datasets:[{ data, backgroundColor:['#6C63FF','#00D4AA','#FF6B6B','#FFB347','#FF87C3'], borderWidth:0 }] }, options:{ responsive:true, maintainAspectRatio:false, cutout:'68%' } });
    }
    document.querySelectorAll('[data-nav]').forEach(el=>el.addEventListener('click',(e)=>{ e.preventDefault(); const page = el.getAttribute('data-nav'); navigate(page); }));
  }
  function renderExpenses() {
    const uid = currentUser.id;
    let expenses = appData.expenses[uid] || [];
    const html = `<div class="form-card"><div class="form-title">Add Expense</div><div class="form-row"><input type="text" id="exp-desc" placeholder="Description (e.g. Groceries)" /></div><div class="form-row"><input type="number" id="exp-amount" placeholder="Amount (KES)" /></div><div class="form-row"><select id="exp-cat"><option>Food</option><option>Transport</option><option>Bills</option><option>Shopping</option><option>Health</option><option>Other</option></select></div><div class="form-row"><input type="date" id="exp-date" /></div><button class="btn-primary" id="addExpenseBtn">Add Transaction</button></div>
    <div class="form-card"><div class="form-title">Transaction History</div><div id="expense-list">${expenses.length===0?'<div>No transactions</div>':expenses.slice().reverse().map(e=>`<div class="goal-list-item"><div><strong>${e.description}</strong><div style="font-size:12px">${e.category} - ${new Date(e.date).toLocaleDateString()}</div></div><div style="color:var(--red)">-${formatKes(e.amount)}</div><button class="delete-exp" data-id="${e.id}" style="background:none;border:none;color:var(--text-sub);cursor:pointer">✖</button></div>`).join('')}</div></div>`;
    document.getElementById('app-content').innerHTML = html;
    document.getElementById('addExpenseBtn')?.addEventListener('click',()=>{ const desc=document.getElementById('exp-desc').value.trim(); const amt=parseFloat(document.getElementById('exp-amount').value); const cat=document.getElementById('exp-cat').value; const date=document.getElementById('exp-date').value||new Date().toISOString().split('T')[0]; if(!desc||!amt) showToast('Description and amount required',true); else { appData.expenses[uid].push({ id:Date.now(), description:desc, amount:amt, category:cat, date }); saveData(); renderExpenses(); showToast('Expense added'); } });
    document.querySelectorAll('.delete-exp').forEach(btn=>btn.addEventListener('click',(e)=>{ const id=parseInt(btn.getAttribute('data-id')); appData.expenses[uid]=appData.expenses[uid].filter(e=>e.id!==id); saveData(); renderExpenses(); showToast('Deleted'); }));
  }
  function renderSavings() {
    const uid = currentUser.id;
    let savings = appData.savings[uid] || [];
    const html = `<div class="form-card"><div class="form-title">Add Savings</div><div class="form-row"><input type="text" id="save-purpose" placeholder="Purpose (e.g. Emergency Fund)" /></div><div class="form-row"><input type="number" id="save-amount" placeholder="Amount (KES)" /></div><div class="form-row"><input type="date" id="save-date" /></div><button class="btn-primary" id="addSaveBtn">Record Saving</button></div>
    <div class="form-card"><div class="form-title">Savings History</div><div id="savings-list-full">${savings.length===0?'<div>No savings recorded</div>':savings.slice().reverse().map(s=>`<div class="goal-list-item"><div><strong>${s.purpose}</strong><div style="font-size:12px">${new Date(s.date).toLocaleDateString()}</div></div><div style="color:var(--mint)">+${formatKes(s.amount)}</div><button class="delete-save" data-id="${s.id}" style="background:none;border:none;cursor:pointer">✖</button></div>`).join('')}</div></div>`;
    document.getElementById('app-content').innerHTML = html;
    document.getElementById('addSaveBtn')?.addEventListener('click',()=>{ const purpose=document.getElementById('save-purpose').value.trim(); const amt=parseFloat(document.getElementById('save-amount').value); const date=document.getElementById('save-date').value||new Date().toISOString().split('T')[0]; if(!purpose||!amt) showToast('Purpose and amount required',true); else { appData.savings[uid].push({ id:Date.now(), purpose, amount:amt, date }); saveData(); renderSavings(); showToast('Savings added'); } });
    document.querySelectorAll('.delete-save').forEach(btn=>btn.addEventListener('click',(e)=>{ const id=parseInt(btn.getAttribute('data-id')); appData.savings[uid]=appData.savings[uid].filter(s=>s.id!==id); saveData(); renderSavings(); showToast('Deleted'); }));
  }
  function renderGoals() {
    const uid = currentUser.id;
    let goals = appData.goals[uid] || [];
    const html = `<div class="form-card"><div class="form-title">Add Goal</div><div class="form-row"><input type="text" id="goal-name" placeholder="Goal name (e.g. New Laptop)" /></div><div class="form-row"><input type="number" id="goal-target" placeholder="Target amount (KES)" /></div><div class="form-row"><input type="number" id="goal-saved" placeholder="Amount saved so far" value="0" /></div><button class="btn-primary" id="addGoalBtn">Create Goal</button></div>
    <div class="form-card"><div class="form-title">My Goals</div><div id="goals-list-full">${goals.length===0?'<div>No goals yet</div>':goals.map(g=>`<div class="goal-list-item"><div><strong>${g.name}</strong><div class="goal-bar" style="width:100px;margin-top:5px"><div class="goal-fill" style="width:${g.target>0?Math.min(100,(g.saved/g.target)*100):0}%;height:4px"></div></div></div><div>${formatKes(g.saved)} / ${formatKes(g.target)}</div><button class="delete-goal" data-id="${g.id}" style="background:none;border:none;cursor:pointer">✖</button><button class="add-progress" data-id="${g.id}" style="background:var(--input-bg);border:none;border-radius:8px;padding:4px 8px;cursor:pointer">+Add</button></div>`).join('')}</div></div>`;
    document.getElementById('app-content').innerHTML = html;
    document.getElementById('addGoalBtn')?.addEventListener('click',()=>{ const name=document.getElementById('goal-name').value.trim(); const target=parseFloat(document.getElementById('goal-target').value); const saved=parseFloat(document.getElementById('goal-saved').value)||0; if(!name||!target) showToast('Name and target required',true); else { appData.goals[uid].push({ id:Date.now(), name, target, saved }); saveData(); renderGoals(); showToast('Goal added'); } });
    document.querySelectorAll('.delete-goal').forEach(btn=>btn.addEventListener('click',(e)=>{ const id=parseInt(btn.getAttribute('data-id')); appData.goals[uid]=appData.goals[uid].filter(g=>g.id!==id); saveData(); renderGoals(); showToast('Goal deleted'); }));
    document.querySelectorAll('.add-progress').forEach(btn=>btn.addEventListener('click',(e)=>{ const id=parseInt(btn.getAttribute('data-id')); const addAmount = parseFloat(prompt('Enter amount to add towards goal (KES):')); if(addAmount && addAmount>0) { const goal = appData.goals[uid].find(g=>g.id===id); if(goal){ goal.saved += addAmount; saveData(); renderGoals(); showToast(`Added ${formatKes(addAmount)} to goal`); } } }));
  }
  function renderSettings() {
    const user = currentUser;
    const html = `<div class="form-card"><div class="form-title">Profile Settings</div><div class="settings-group"><label>Full Name</label><input type="text" id="settings-name" value="${user.name||''}" /></div><div class="settings-group"><label>Email Address</label><input type="email" id="settings-email" value="${user.email||''}" /></div><div class="settings-group"><label>New Password (leave blank to keep same)</label><input type="password" id="settings-pw" placeholder="••••••" /></div><button class="save-settings" id="saveSettingsBtn">Save Changes</button></div>`;
    document.getElementById('app-content').innerHTML = html;
    document.getElementById('saveSettingsBtn')?.addEventListener('click',()=>{ const newName = document.getElementById('settings-name').value.trim(); const newEmail = document.getElementById('settings-email').value.trim(); const newPw = document.getElementById('settings-pw').value; if(newName) user.name = newName; if(newEmail) user.email = newEmail; if(newPw) user.password = newPw; const idx = appData.users.findIndex(u=>u.id===user.id); if(idx!==-1) appData.users[idx]=user; saveData(); currentUser=user; sessionStorage.setItem('bf_current_user', JSON.stringify(user)); updateSidebarUser(); showToast('Profile updated'); renderSettings(); });
  }
  function navigate(page) {
    document.querySelectorAll('.nav-item').forEach(nav=>nav.classList.remove('active'));
    document.querySelector(`.nav-item[data-page="${page}"]`)?.classList.add('active');
    document.getElementById('page-title').innerText = page.charAt(0).toUpperCase()+page.slice(1);
    if(page==='dashboard') renderDashboard();
    else if(page==='expenses') renderExpenses();
    else if(page==='savings') renderSavings();
    else if(page==='goals') renderGoals();
    else if(page==='settings') renderSettings();
  }
  function showToast(msg, isError=false) { const toast=document.getElementById('toast'); document.getElementById('toast-msg').innerText=msg; toast.style.background=isError?'rgba(255,107,107,0.9)':'var(--card)'; toast.classList.add('show'); setTimeout(()=>toast.classList.remove('show'),2500); }
  function openSidebar() { document.getElementById('sidebar').classList.add('open'); document.getElementById('overlay').classList.add('open'); }
  function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('open'); }
  function toggleTheme() { const html=document.documentElement; const newTheme=html.getAttribute('data-theme')==='dark'?'light':'dark'; html.setAttribute('data-theme',newTheme); localStorage.setItem('bf-theme',newTheme); document.getElementById('toggle-emoji').textContent=newTheme==='dark'?'🌙':'☀️'; if(spendChart) spendChart.update(); }
  
  // AUTH FLOW - handle login/signup if no session
  function initAuth() {
    loadData();
    if(!currentUser) {
      const loginHtml = `
        <div style="max-width:480px;margin:80px auto;background:var(--card);border-radius:28px;padding:40px;">
          <div class="logo" style="justify-content:center;margin-bottom:28px"><div class="logo-icon">💸</div><div class="logo-text">Budget<span>Flow</span></div></div>
          <div id="auth-tabs" style="display:flex;gap:12px;margin-bottom:24px"><button id="show-login" style="flex:1;padding:12px;background:var(--purple);border:none;border-radius:12px;color:white;cursor:pointer">Sign In</button><button id="show-signup" style="flex:1;padding:12px;background:var(--input-bg);border:none;border-radius:12px;cursor:pointer">Create Account</button></div>
          <div id="login-panel"><div class="form-row"><input type="email" id="login-email" placeholder="Email" /></div><div class="form-row"><input type="password" id="login-password" placeholder="Password" /></div><button id="do-login" class="btn-primary">Sign In</button></div>
          <div id="signup-panel" style="display:none"><div class="form-row"><input type="text" id="signup-name" placeholder="Full Name" /></div><div class="form-row"><input type="email" id="signup-email" placeholder="Email" /></div><div class="form-row"><input type="password" id="signup-password" placeholder="Password" /></div><button id="do-signup" class="btn-primary">Create Account</button></div>
        </div>`;
      document.getElementById('app-content').innerHTML = loginHtml;
      document.getElementById('show-login')?.addEventListener('click',()=>{ document.getElementById('login-panel').style.display='block'; document.getElementById('signup-panel').style.display='none'; });
      document.getElementById('show-signup')?.addEventListener('click',()=>{ document.getElementById('login-panel').style.display='none'; document.getElementById('signup-panel').style.display='block'; });
      document.getElementById('do-login')?.addEventListener('click',()=>{ const email=document.getElementById('login-email').value; const pw=document.getElementById('login-password').value; const res=loginUser(email,pw); if(res.success) { currentUser=res.user; sessionStorage.setItem('bf_current_user',JSON.stringify(currentUser)); ensureUserStructures(); navigate('dashboard'); } else showToast(res.msg,true); });
      document.getElementById('do-signup')?.addEventListener('click',()=>{ const name=document.getElementById('signup-name').value; const email=document.getElementById('signup-email').value; const pw=document.getElementById('signup-password').value; const res=registerUser(name,email,pw); if(res.success) { currentUser=res.user; sessionStorage.setItem('bf_current_user',JSON.stringify(currentUser)); ensureUserStructures(); navigate('dashboard'); } else showToast(res.msg,true); });
      return false;
    }
    ensureUserStructures();
    return true;
  }
  function startApp() {
    const themed = localStorage.getItem('bf-theme');
    if(themed) document.documentElement.setAttribute('data-theme',themed);
    if(initAuth()) { navigate('dashboard'); }
    document.querySelectorAll('.nav-item[data-page]').forEach(link=>link.addEventListener('click',(e)=>{ e.preventDefault(); const page=link.getAttribute('data-page'); navigate(page); closeSidebar(); }));
  }
  startApp();
  window.openSidebar=openSidebar; window.closeSidebar=closeSidebar; window.toggleTheme=toggleTheme;
</script>
</body>
</html>
